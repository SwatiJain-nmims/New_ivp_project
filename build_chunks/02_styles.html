  <style>
    :root {
      --bg-base: #0a0e17;
      --bg-panel: #111827;
      --bg-card: #1f2937;
      --bg-subtle: #374151;
      --border-color: #2d3748;
      --border-glow: #3b82f6;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: thin;
      scrollbar-color: #374151 #111827;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
      overflow-x: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Navigation Bar */
    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 50;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--primary));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-family: var(--font-mono);
      font-size: 15px;
      color: #fff;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 9999px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--accent-emerald);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
      animation: pulse-dot 2s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn:hover {
      background: var(--bg-subtle);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
    }

    .btn-active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Tab Bar */
    .tab-bar {
      display: flex;
      background: #0d131f;
      border-bottom: 1px solid var(--border-color);
      padding: 0 16px;
      gap: 4px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.02);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: rgba(59, 130, 246, 0.08);
      font-weight: 600;
    }

    .tab-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      background: var(--bg-card);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-dim);
    }

    .tab-btn.active .tab-badge {
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent-cyan);
    }

    /* Main Workspace Layout */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Left Viewer Area (Dual Canvas & Histograms) */
    .viewer-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #070a10;
      padding: 12px;
      gap: 12px;
    }

    .viewer-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-panel);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .metrics-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .metric-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .metric-label {
      color: var(--text-dim);
    }

    .metric-value {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    /* Dual Canvas Container */
    .canvases-container {
      flex: 1;
      display: flex;
      gap: 12px;
      min-height: 0;
      position: relative;
    }

    .canvas-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .canvas-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--border-color);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .canvas-viewport {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #111827 0%, #070a10 100%);
      overflow: hidden;
      cursor: crosshair;
    }

    .canvas-viewport canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      image-rendering: pixelated;
    }

    /* Overlay canvas for gestures & annotations */
    .overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Split Screen Comparison Slider Mode */
    .split-slider-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      overflow: hidden;
    }

    .split-slider-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      cursor: ew-resize;
      z-index: 20;
    }

    .split-slider-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
    }

    /* Bottom Histograms and Formula Bar */
    .viewer-bottom-panel {
      display: flex;
      gap: 12px;
      height: 180px;
      flex-shrink: 0;
    }

    .histograms-card {
      flex: 2;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
    }

    .histograms-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .histograms-canvases {
      flex: 1;
      display: flex;
      gap: 12px;
      min-height: 0;
    }

    .hist-canvas-box {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .hist-canvas-box span {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      margin-bottom: 2px;
    }

    .hist-canvas-box canvas {
      width: 100%;
      flex: 1;
      background: #090d16;
      border-radius: 4px;
      border: 1px solid #1a2234;
    }

    .formula-card {
      flex: 3;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .formula-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-purple);
      margin-bottom: 6px;
    }

    .formula-math-display {
      font-family: var(--font-mono);
      font-size: 13px;
      color: #e2e8f0;
      background: #0d131f;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #1f2937;
      overflow-x: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .formula-notes {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* Right Sidebar Controls */
    .sidebar {
      width: 380px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Module Control Panels */
    .module-pane {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .module-pane.active {
      display: flex;
    }

    .control-section {
      background: #0f1624;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-row-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .control-value {
      font-family: var(--font-mono);
      color: var(--accent-cyan);
      font-weight: 500;
    }

    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--bg-card);
      border-radius: 3px;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
      transition: all 0.15s ease;
    }

    .slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      background: var(--accent-cyan);
    }

    select, input[type="text"], input[type="number"] {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 10px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 6px rgba(59, 130, 246, 0.4);
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-group .btn {
      flex: 1;
      justify-content: center;
      padding: 6px 8px;
      font-size: 12px;
      text-align: center;
    }

    /* Gesture Status Floating HUD */
    .gesture-hud {
      position: absolute;
      bottom: 200px;
      left: 24px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 40;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .gesture-icon-badge {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .gesture-info {
      display: flex;
      flex-direction: column;
    }

    .gesture-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    .gesture-mapping {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--accent-cyan);
    }

    /* Mini webcam preview card in sidebar bottom */
    .webcam-preview-box {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      position: relative;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .webcam-preview-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .webcam-preview-box canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      pointer-events: none;
    }

    /* Modal / Alert / Info box styling */
    .info-callout {
      background: rgba(59, 130, 246, 0.08);
      border-left: 3px solid var(--primary);
      padding: 8px 12px;
      font-size: 12px;
      color: #cbd5e1;
      border-radius: 0 4px 4px 0;
    }

    .info-callout code {
      font-family: var(--font-mono);
      color: var(--accent-cyan);
      background: rgba(0, 0, 0, 0.3);
      padding: 1px 4px;
      border-radius: 3px;
    }
  </style>
</head>
